# AppProjects are created before the ApplicationSets that reference them.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Application workloads rendered from apps/* with charts/service
  sourceRepos:
    - https://github.com/ozy31/gitops-multicluster-dr.git
  destinations:
    - server: '*'
      namespace: '*'
  # Workloads may not create cluster-scoped objects.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Cluster addons installed from upstream Helm charts
  sourceRepos:
    - https://github.com/ozy31/gitops-multicluster-dr.git
    - https://kedacore.github.io/charts
    - https://kubernetes-sigs.github.io/external-dns
    - https://kubernetes-sigs.github.io/metrics-server
    - https://kubernetes.github.io/ingress-nginx
    - https://aws.github.io/eks-charts
  destinations:
    - server: '*'
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
