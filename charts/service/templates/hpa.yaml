{{- /*
The HPA only exists on the active site. On the standby the Deployment is
pinned to dr.standbyReplicas instead, because an HPA cannot scale to zero.

When the site becomes active again the Deployment drops its replicas field.
With ArgoCD's default client-side apply that field is removed and the API
server defaults it to 1, after which the HPA takes over. With server-side
apply the field would keep its last value (0) and an HPA does not scale a
Deployment that sits at 0, so prefer the KEDA path for SSA-managed apps.
*/}}
{{- if and .Values.autoscaling.hpa.enabled (eq (include "service.isActive" .) "true") }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "service.fullname" . }}
  minReplicas: {{ .Values.autoscaling.hpa.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.hpa.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
{{- end }}
